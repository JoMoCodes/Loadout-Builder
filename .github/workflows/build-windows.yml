name: Build Windows app

# Every pull request, every push to main and every v* tag first runs the privacy scan. Only if
# that passes do two jobs start side by side: the checks (code style, types, tests) on Linux,
# and the Windows build, which compiles the app and starts it once to click through every page
# (the smoke check). A push to main, a v* tag or a build started by hand also makes the .exe
# files and uploads them as a workflow artifact; pull requests skip that, since nobody downloads
# a pull request's installer and making it is the slowest part of the build. A push to main
# whose apps/desktop/package.json version has no GitHub Release yet (or a pushed v* tag) also
# publishes that release, which installed copies of the app pick up as an update. Everything
# waits for the privacy scan, so nothing is built or published from a commit that holds real
# driver data.
#
# A branch is built through its pull request, not on every push, so each change is built once.
# Pushing to a pull request again cancels the build that was still running for it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests are cancelled by a newer push. A release build on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The secrets scan needs to list a pull request's commits.
  pull-requests: read

jobs:
  privacy-scan:
    name: Privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Looks for emails, phone numbers, IDs and VINs that are not made up, and the station
      # code. The station code and DSP name come from a repository secret named
      # LB_STATION_CODE (several can be separated by commas). Without the secret that one
      # check is skipped, and the scan says so.
      - name: Scan the repo for real driver data
        run: node scripts/privacy-scan.mjs
        env:
          LB_STATION_CODE: ${{ secrets.LB_STATION_CODE }}

      # Looks through the history for passwords, keys and tokens.
      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails if a commit message or the pull request text contains a private Claude Code
      # session link. Those links were once added automatically and had to be scrubbed.
      # The pull request text is read from GitHub as it is now, not as it was when the run
      # started, so after a link is taken out of the text a re-run of this job passes.
      - name: Check for Claude session links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pattern="claude\.ai/code/session|Claude-Session:"
          PR_TEXT=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            messages=$(git log --format=%B "origin/${GITHUB_BASE_REF}..HEAD")
            PR_TEXT=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + "\n" + (.body // "")')
          else
            messages=$(git log -n 50 --format=%B)
          fi
          if printf "%s\n%s" "$messages" "$PR_TEXT" | grep -Eq "$pattern"; then
            echo "::error::A commit message or the pull request text contains a Claude session link. Remove it (see CLAUDE.md)."
            exit 1
          fi
          echo "No Claude session links found."

  # The code style, type and test checks run on Linux, beside the Windows build rather than
  # before it. Linux runners start faster and run the tests quicker than the Windows one, and
  # nothing in these checks needs Windows: the built app is still started on Windows below.
  checks:
    name: Check style, types and tests
    needs: privacy-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the code style
        run: npm run lint

      - name: Check the types
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build and start the app
    needs: privacy-scan
    runs-on: windows-latest
    env:
      # The .exe files are only made where someone downloads them: a push to main, a release
      # tag, or a build started by hand from the Actions page. Pull requests skip them.
      MAKE_INSTALLER: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # setup-node only keeps npm's own download store. Electron and the installer tools
      # (NSIS) are downloaded separately, so they are kept between runs here.
      - name: Keep Electron and the installer tools between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install
        run: npm ci

      - name: Build the app
        if: env.MAKE_INSTALLER != 'true'
        run: npm run build -w @loadout/desktop

      - name: Build installer and portable .exe
        if: env.MAKE_INSTALLER == 'true'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Starts the built app once on Windows and clicks through every page, using made-up data
      # in a throwaway folder. It uses the files the step above just built (the installer is not
      # needed for this). If the app does not open, nothing is published.
      - name: Start the app and check every page
        run: npm run smoke -w @loadout/desktop -- --no-build
        timeout-minutes: 10
        env:
          SMOKE_TIMEOUT_MS: '420000'

      - name: Upload Windows build
        if: env.MAKE_INSTALLER == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Loadout-Builder-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # Releases are published here in one step (not by electron-builder, whose parallel uploads
  # can race each other). A release is published for a v* tag push, or for a push to main
  # whose apps/desktop/package.json version has no complete release yet.
  release:
    name: Publish release
    needs: [privacy-scan, checks, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: Loadout-Builder-Windows
          path: release-files

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $tag. Bump the version first."
              exit 1
            fi
          fi

          shopt -s nullglob
          files=(release-files/*.exe release-files/*.blockmap release-files/latest.yml)
          if [ ! -f release-files/latest.yml ]; then
            echo "::error::latest.yml was not generated; installed apps could not find this update."
            exit 1
          fi

          if assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if echo "$assets" | grep -qx 'latest.yml'; then
              echo "Release $tag is already complete. Bump the version in apps/desktop/package.json to publish an update."
              exit 0
            fi
            echo "Release $tag exists but is incomplete; uploading its files."
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Publishing release $tag"
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Loadout Builder $tag" --generate-notes
          fi
