name: Build Windows app

# Every push first runs the privacy scan. Only if that passes does it build and test the app,
# start it once on Windows (the smoke check), and upload the .exe files as a workflow artifact.
# A push to main whose apps/desktop/package.json version has no GitHub Release yet (or a pushed
# v* tag) also publishes that release, which installed copies of the app pick up as an update.
# The build and the release both wait for the privacy scan, so nothing is built or published
# from a commit that holds real driver data.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The secrets scan needs to list a pull request's commits.
  pull-requests: read

jobs:
  privacy-scan:
    name: Privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Looks for emails, phone numbers, IDs and VINs that are not made up, and the station
      # code. The station code and DSP name come from a repository secret named
      # LB_STATION_CODE (several can be separated by commas). Without the secret that one
      # check is skipped, and the scan says so.
      - name: Scan the repo for real driver data
        run: node scripts/privacy-scan.mjs
        env:
          LB_STATION_CODE: ${{ secrets.LB_STATION_CODE }}

      # Looks through the history for passwords, keys and tokens.
      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test
    needs: privacy-scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the code style
        run: npm run lint

      - name: Check the types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer and portable .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Starts the built app once on Windows and clicks through every page, using made-up data
      # in a throwaway folder. It uses the files the step above just built. If the app does not
      # open, nothing is published.
      - name: Start the app and check every page
        run: npm run smoke -w @loadout/desktop -- --no-build
        timeout-minutes: 10
        env:
          SMOKE_TIMEOUT_MS: '420000'

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Loadout-Builder-Windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # Releases are published here in one step (not by electron-builder, whose parallel uploads
  # can race each other). A release is published for a v* tag push, or for a push to main
  # whose apps/desktop/package.json version has no complete release yet.
  release:
    name: Publish release
    needs: [privacy-scan, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: Loadout-Builder-Windows
          path: release-files

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $tag. Bump the version first."
              exit 1
            fi
          fi

          shopt -s nullglob
          files=(release-files/*.exe release-files/*.blockmap release-files/latest.yml)
          if [ ! -f release-files/latest.yml ]; then
            echo "::error::latest.yml was not generated; installed apps could not find this update."
            exit 1
          fi

          if assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if echo "$assets" | grep -qx 'latest.yml'; then
              echo "Release $tag is already complete. Bump the version in apps/desktop/package.json to publish an update."
              exit 0
            fi
            echo "Release $tag exists but is incomplete; uploading its files."
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Publishing release $tag"
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Loadout Builder $tag" --generate-notes
          fi
